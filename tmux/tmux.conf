# remap prefix from 'C-b' to 'C-and C-b
unbind C-b
set -g prefix C-Space
set -g prefix2 C-@
bind C-Space send-prefix
bind C-@ send-prefix

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# better split commands
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

set -sg escape-time 0

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# screen-256color has no truecolor and no synchronized-output capability, so
# nvim and other full-screen apps redraw the whole pane per keystroke.
set -g default-terminal "tmux-256color"

# Tell tmux what the outer terminal can do. Sync enables synchronized output
# (DECSET 2026), which stops the tearing that makes TUI input feel slow.
set -as terminal-features ",*:RGB:Sync"

# Let nvim and image viewers send escape sequences straight to the outer terminal.
set -g allow-passthrough on
set -g focus-events "on"
